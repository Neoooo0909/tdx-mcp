[project]
name = "tdx-mcp"
version = "0.1.0"
description = "MCP server for TDX (通达信) A-share market data — realtime quotes, K-lines, finance, and more"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "tdx", "a-share", "stock", "china", "market-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "eltdx>=0.5.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
tdx-mcp = "tdx_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Neoooo0909/tdx-mcp"
Repository = "https://github.com/Neoooo0909/tdx-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdx_mcp", "src/tdxapi"]
